<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁前线 · 坦克大战</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --text: #c9d1d9;
    --dim: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 600px at 50% -10%, #16212e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    color: #e6edf3;
  }
  header .tag {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .stage {
    position: relative;
    background: #010409;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  canvas {
    display: block;
    border-radius: 6px;
    background: #02040a;
  }
  .hud {
    display: flex;
    width: 100%;
    justify-content: space-between;
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    min-width: 110px;
    text-align: center;
  }
  .stat .label { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  .stat .value { font-size: 20px; font-weight: 700; color: #e6edf3; margin-top: 2px; }
  .stat .value.lives { color: #3fb950; }
  .stat .value.score { color: #d29922; }
  .controls {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: .5px;
    text-align: center;
  }
  .controls b { color: var(--text); font-weight: 600; }
  kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>钢铁前线</h1>
      <span class="tag">TANK ASSAULT · 坦克大战</span>
    </header>
    <div class="stage">
      <canvas id="game" width="600" height="520"></canvas>
    </div>
    <div class="hud">
      <div class="stat"><div class="label">得分 SCORE</div><div class="value score" id="score">0</div></div>
      <div class="stat"><div class="label">关卡 LEVEL</div><div class="value" id="level">1</div></div>
      <div class="stat"><div class="label">生命 LIVES</div><div class="value lives" id="lives">3</div></div>
      <div class="stat"><div class="label">剩余敌人</div><div class="value" id="enemies">0</div></div>
    </div>
    <div class="controls">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>方向键</kbd> 移动 &nbsp;·&nbsp; <kbd>空格</kbd> / <kbd>J</kbd> 射击 &nbsp;·&nbsp; <kbd>P</kbd> 暂停
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 画布与上下文 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;   // 600
  const H = canvas.height;  // 520

  // ---------- 常量 ----------
  const T = 40;             // 瓦片尺寸
  const COLS = W / T;       // 15
  const ROWS = H / T;       // 13
  const TANK = 32;          // 坦克碰撞盒边长
  const PAD = (T - TANK) / 2;

  // 瓦片类型
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

  // 方向
  const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
  const DIR_VEC = [
    { x: 0,  y: -1 },
    { x: 1,  y: 0  },
    { x: 0,  y: 1  },
    { x: -1, y: 0  },
  ];

  // ---------- 音频（Web Audio，无外部文件）----------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function ensureAudio() {
    if (!actx) actx = new AudioCtx();
    if (actx.state === "suspended") actx.resume();
  }
  function beep(freq, dur = 0.08, type = "square", vol = 0.04) {
    if (!actx) return;
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(actx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  const sfx = {
    shoot()   { beep(880, 0.06, "square", 0.03); },
    hitBrick(){ beep(180, 0.05, "sawtooth", 0.05); },
    hitSteel(){ beep(700, 0.03, "triangle", 0.05); },
    explode() { beep(120, 0.25, "sawtooth", 0.09); beep(60, 0.3, "square", 0.07); },
    powerup() { beep(660, 0.08, "sine", 0.06); setTimeout(() => beep(990, 0.1, "sine", 0.06), 80); },
    life()    { beep(523, 0.1, "sine", 0.06); setTimeout(() => beep(784, 0.14, "sine", 0.06), 90); },
  };

  // ---------- 输入 ----------
  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k) || k === " ") {
      e.preventDefault();
    }
    if (k === " " || k === "j") { shooting = true; }
    keys.add(k);
    if (k === "p" && state === "play") togglePause();
    if ((k === "enter" || k === " ") && (state === "start" || state === "gameover")) startGame();
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    keys.delete(k);
    if (k === " " || k === "j") { shooting = false; }
  });
  let shooting = false;

  // ---------- 游戏状态 ----------
  let state = "start";      // start | play | pause | gameover
  let grid = [];            // 2D 数组，当前瓦片
  let baseGrid = [];        // 原始瓦片（用于重开关卡）
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let powerups = [];
  let floatingTexts = [];
  let score = 0;
  let level = 1;
  let lives = 3;
  let pendingEnemies = 0;   // 本关还未刷出的敌人
  let spawnTimer = 0;
  let spawnCount = 0;       // 本关已刷出数量
  let baseAlive = true;
  let lastTime = 0;
  let shake = 0;

  // ---------- 地图生成 ----------
  function makeMap() {
    grid = [];
    baseGrid = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push(new Array(COLS).fill(EMPTY));
      baseGrid.push(new Array(COLS).fill(EMPTY));
    }
    const layouts = [
      buildSymMap, buildFortMap, buildCrossMap
    ];
    layouts[(level - 1) % layouts.length]();
    // 基地
    const bc = Math.floor(COLS / 2);
    set(BASE, ROWS - 2, bc);
    set(BRICK, ROWS - 2, bc - 1);
    set(BRICK, ROWS - 2, bc + 1);
    set(BRICK, ROWS - 1, bc - 1);
    set(BRICK, ROWS - 1, bc + 1);
    set(BRICK, ROWS - 1, bc);
    // 玩家出生点
    playerSpawn = { x: bc * T + PAD, y: (ROWS - 1) * T + PAD, dir: UP };
    syncBaseGrid();
  }
  function set(type, r, c) {
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) grid[r][c] = type;
  }
  function syncBaseGrid() {
    baseGrid = grid.map(row => row.slice());
  }

  function buildSymMap() {
    // 左右对称的砖块 + 中间钢墙
    for (let r = 2; r < ROWS - 3; r += 2) {
      for (let c = 0; c < COLS; c++) {
        if (c === Math.floor(COLS / 2)) continue;
        set(BRICK, r, c);
      }
    }
    for (let r = 0; r < 4; r++) {
      set(STEEL, r, 2);
      set(STEEL, r, COLS - 3);
    }
    set(STEEL, 5, 4); set(STEEL, 5, COLS - 5);
    set(STEEL, 7, 4); set(STEEL, 7, COLS - 5);
  }

  function buildFortMap() {
    // 中央堡垒 + 水道
    for (let r = 4; r <= 8; r++) {
      for (let c = 4; c <= 10; c++) {
        const edge = (r === 4 || r === 8 || c === 4 || c === 10);
        if (edge) set(STEEL, r, c);
      }
    }
    set(BRICK, 4, 7); set(BRICK, 8, 7); set(BRICK, 6, 4); set(BRICK, 6, 10);
    for (let c = 0; c < COLS; c += 2) {
      set(BRICK, 1, c);
      set(BRICK, ROWS - 3, c);
    }
    set(WATER, 2, 2); set(WATER, 2, 3); set(WATER, 2, COLS - 3); set(WATER, 2, COLS - 4);
  }

  function buildCrossMap() {
    for (let r = 2; r < ROWS - 2; r += 3) {
      for (let c = 0; c < COLS; c++) set(BRICK, r, c);
    }
    for (let c = 2; c < COLS - 2; c += 3) {
      for (let r = 0; r < ROWS - 2; r++) set(BRICK, r, c);
    }
    // 打通一些口子
    for (let c = 0; c < COLS; c += 3) { set(EMPTY, 2, c); set(EMPTY, 5, c); set(EMPTY, 8, c); }
    set(STEEL, 3, 1); set(STEEL, 3, COLS - 2);
    set(STEEL, 9, 1); set(STEEL, 9, COLS - 2);
    set(TREE, 6, Math.floor(COLS / 2));
    set(TREE, 6, Math.floor(COLS / 2) - 1);
  }

  // ---------- 实体 ----------
  let playerSpawn = { x: 0, y: 0, dir: UP };

  function makeTank(x, y, dir, kind) {
    return {
      x, y, dir,
      w: TANK, h: TANK,
      kind,                       // "player" | "enemy"
      hp: kind === "player" ? 1 : (level >= 5 ? 2 : 1),
      speed: kind === "player" ? 2.6 : (1.3 + level * 0.12),
      cd: 0,                      // 射击冷却
      moveT: 0,                   // AI 转向计时
      aimT: 0,
      shield: 0,                  // 护盾剩余时间(帧)
      rapid: 0,
      flash: 0,
    };
  }

  function spawnEnemy() {
    const spots = [
      { c: 0, dir: DOWN },
      { c: Math.floor(COLS / 2), dir: DOWN },
      { c: COLS - 1, dir: DOWN },
    ];
    const s = spots[Math.floor(Math.random() * spots.length)];
    const e = makeTank(s.c * T + PAD, 0 * T + PAD, s.dir, "enemy");
    // 出生点若被占则换位置
    for (let i = 0; i < 3; i++) {
      const alt = spots[(spots.indexOf(s) + i) % spots.length];
      e.x = alt.c * T + PAD;
      e.y = 0 * T + PAD;
      e.dir = alt.dir;
      if (!tankBlocked(e.x, e.y, e)) break;
    }
    enemies.push(e);
    spawnCount++;
  }

  function spawnPowerup(x, y) {
    const r = Math.random();
    let type;
    if (r < 0.3) type = "life";
    else if (r < 0.55) type = "shield";
    else if (r < 0.8) type = "rapid";
    else type = "nuke";
    powerups.push({ x: x - 16, y: y - 16, w: 32, h: 32, type, t: 0 });
  }

  // ---------- 碰撞检测 ----------
  function solidAt(px, py) {
    const c = Math.floor(px / T);
    const r = Math.floor(py / T);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return STEEL; // 边界视为实体
    const t = grid[r][c];
    if (t === BRICK || t === STEEL || t === WATER || t === BASE) return t;
    if (t === TREE) return TREE;
    return EMPTY;
  }

  function rectHitsTile(x, y, w, h, pred) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + w - 0.01) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + h - 0.01) / T);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) { if (pred(STEEL, r, c)) return { t: STEEL, r, c }; continue; }
        const t = grid[r][c];
        if (pred(t, r, c)) return { t, r, c };
      }
    }
    return null;
  }

  function tankBlocked(x, y, self) {
    // 边界
    if (x < 0 || y < 0 || x + TANK > W || y + TANK > H) return true;
    // 瓦片（坦克不能进入砖、钢、水、树、基地；基地也阻挡移动，避免压旗）
    const hit = rectHitsTile(x, y, TANK, TANK, (t) => t === BRICK || t === STEEL || t === WATER || t === TREE || t === BASE);
    if (hit) return true;
    // 其他坦克
    const all = [player, ...enemies].filter(t => t && t !== self && t.hp > 0);
    for (const t of all) {
      if (x < t.x + t.w && x + TANK > t.x && y < t.y + t.h && y + TANK > t.y) return true;
    }
    return false;
  }

  function moveTank(tank, dir) {
    tank.dir = dir;
    const v = DIR_VEC[dir];
    const nx = tank.x + v.x * tank.speed;
    const ny = tank.y + v.y * tank.speed;
    if (!tankBlocked(nx, ny, tank)) {
      tank.x = nx; tank.y = ny;
    } else {
      // 尝试沿轴向对齐（贴近瓦片边界，便于转弯）
      if (dir === UP || dir === DOWN) {
        const aligned = Math.round(tank.x / T) * T + PAD;
        if (Math.abs(aligned - tank.x) <= tank.speed && !tankBlocked(aligned, ny, tank)) { tank.x = aligned; tank.y = ny; }
      } else {
        const aligned = Math.round(tank.y / T) * T + PAD;
        if (Math.abs(aligned - tank.y) <= tank.speed && !tankBlocked(nx, aligned, tank)) { tank.x = nx; tank.y = aligned; }
      }
    }
  }

  // ---------- 子弹 ----------
  function fire(tank) {
    if (tank.cd > 0) return;
    const v = DIR_VEC[tank.dir];
    const cx = tank.x + TANK / 2, cy = tank.y + TANK / 2;
    bullets.push({
      x: cx - 3 + v.x * (TANK / 2),
      y: cy - 3 + v.y * (TANK / 2),
      w: 6, h: 6,
      dir: tank.dir,
      vx: v.x * 5.5,
      vy: v.y * 5.5,
      owner: tank.kind,
      strong: tank.kind === "player" && (tank.rapid > 0 || level >= 4),
    });
    tank.cd = tank.kind === "player" ? (tank.rapid > 0 ? 8 : 16) : 60;
    if (tank.kind === "player") sfx.shoot();
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      let dead = false;

      // 边界
      if (cx < 0 || cx > W || cy < 0 || cy > H) { dead = true; }
      else {
        const r = Math.floor(cy / T), c = Math.floor(cx / T);
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          const t = grid[r][c];
          if (t === BRICK) {
            grid[r][c] = EMPTY;
            dead = true;
            addDebris(c * T, r * T, BRICK);
            sfx.hitBrick();
          } else if (t === STEEL) {
            dead = true;
            spark(cx, cy, "#7aa2f7");
            sfx.hitSteel();
          } else if (t === BASE) {
            destroyBase();
            dead = true;
          }
          // WATER / TREE：子弹穿过
        }
      }

      // 命中坦克
      if (!dead) {
        const targets = b.owner === "player" ? enemies : [player];
        for (const t of targets) {
          if (!t || t.hp <= 0) continue;
          if (b.x < t.x + t.w && b.x + b.w > t.x && b.y < t.y + t.h && b.y + b.h > t.y) {
            if (b.owner === "player" && t === player) continue;
            if (t === player && t.shield > 0) { dead = true; spark(cx, cy, "#3fb950"); break; }
            damageTank(t, b.strong ? 2 : 1);
            dead = true;
            break;
          }
        }
      }

      if (dead) bullets.splice(i, 1);
    }
  }

  function damageTank(tank, dmg) {
    tank.hp -= dmg;
    tank.flash = 8;
    if (tank.hp <= 0) {
      explode(tank.x + TANK / 2, tank.y + TANK / 2, tank.kind === "player" ? "#3fb950" : "#f85149");
      if (tank.kind === "enemy") {
        score += 100 * level;
        addFloating(tank.x + TANK / 2, tank.y, "+" + 100 * level, "#d29922");
        sfx.explode();
        if (Math.random() < 0.16) spawnPowerup(tank.x + TANK / 2, tank.y + TANK / 2);
      } else {
        sfx.explode();
      }
      tank.hp = 0;
    } else {
      sfx.hitSteel();
    }
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    const bc = Math.floor(COLS / 2);
    const br = ROWS - 2;
    explode(bc * T + T / 2, br * T + T / 2, "#d29922");
    shake = 20;
    sfx.explode();
    // 清除基地瓦片
    set(EMPTY, br, bc);
    gameOver();
  }

  // ---------- 粒子与特效 ----------
  function addDebris(x, y, type) {
    const color = type === BRICK ? "#b3593c" : "#7a8288";
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x + T / 2, y: y + T / 2,
        vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
        life: 30 + Math.random() * 20, color, r: 2 + Math.random() * 3,
      });
    }
  }
  function spark(x, y, color) {
    for (let i = 0; i < 5; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 2.5, vy: (Math.random() - 0.5) * 2.5,
        life: 12 + Math.random() * 10, color, r: 1.5 + Math.random() * 1.5,
      });
    }
  }
  function explode(x, y, color) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.5 + Math.random() * 3.5;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 25 + Math.random() * 25,
        color: Math.random() < 0.5 ? color : "#ffab40",
        r: 2 + Math.random() * 3.5,
      });
    }
    // 冲击环
    particles.push({ x, y, vx: 0, vy: 0, life: 18, color: "#ffffff", r: 4, ring: true });
  }
  function addFloating(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 50 });
  }

  // ---------- 道具 ----------
  const POWERUP_INFO = {
    life:   { label: "生命 +1", color: "#3fb950", icon: "♥" },
    shield: { label: "护盾",   color: "#58a6ff", icon: "⛨" },
    rapid:  { label: "连射",   color: "#d29922", icon: "⚡" },
    nuke:   { label: "清屏",   color: "#f85149", icon: "✹" },
  };
  function updatePowerups() {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.t++;
      if (p.t > 600) { powerups.splice(i, 1); continue; }
      if (player && player.hp > 0 &&
          p.x < player.x + TANK && p.x + p.w > player.x &&
          p.y < player.y + TANK && p.y + p.h > player.y) {
        applyPowerup(p.type);
        powerups.splice(i, 1);
      }
    }
  }
  function applyPowerup(type) {
    switch (type) {
      case "life":
        lives++; sfx.life();
        addFloating(player.x, player.y - 8, "生命 +1", "#3fb950");
        break;
      case "shield":
        player.shield = 60 * 8; sfx.powerup();
        addFloating(player.x, player.y - 8, "护盾!", "#58a6ff");
        break;
      case "rapid":
        player.rapid = 60 * 10; sfx.powerup();
        addFloating(player.x, player.y - 8, "连射!", "#d29922");
        break;
      case "nuke":
        for (const e of enemies) { if (e.hp > 0) { e.hp = 0; explode(e.x + TANK / 2, e.y + TANK / 2, "#f85149"); score += 50 * level; } }
        sfx.explode();
        addFloating(player.x, player.y - 8, "清屏!", "#f85149");
        break;
    }
  }

  // ---------- 敌AI ----------
  function updateEnemies() {
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      e.cd--; e.moveT--; e.aimT--; e.flash--; e.shield--; e.rapid--;

      // 朝向玩家射击（概率性）
      if (e.cd <= 0) {
        if (Math.random() < 0.5 && player && player.hp > 0) {
          const dx = player.x - e.x, dy = player.y - e.y;
          if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? RIGHT : LEFT;
          else e.dir = dy > 0 ? DOWN : UP;
        }
        fire(e);
      }

      // 移动决策
      if (e.moveT <= 0) {
        e.moveT = 40 + Math.floor(Math.random() * 80);
        const r = Math.random();
        if (r < 0.35 && player && player.hp > 0) {
          // 追踪玩家
          const dx = player.x - e.x, dy = player.y - e.y;
          const dirs = [];
          if (Math.abs(dx) > 8) dirs.push(dx > 0 ? RIGHT : LEFT);
          if (Math.abs(dy) > 8) dirs.push(dy > 0 ? DOWN : UP);
          if (dirs.length) e.dir = dirs[Math.floor(Math.random() * dirs.length)];
          else e.dir = Math.floor(Math.random() * 4);
        } else if (r < 0.6) {
          e.dir = Math.floor(Math.random() * 4);
        } else {
          e.dir = (e.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
        }
      }
      moveTank(e, e.dir);
    }
    enemies = enemies.filter(e => e.hp > 0);
  }

  // ---------- 玩家 ----------
  function updatePlayer() {
    if (!player || player.hp <= 0) return;
    player.cd--; player.flash--; player.shield--; player.rapid--;

    let moved = false;
    if (keys.has("w") || keys.has("arrowup"))    { moveTank(player, UP); moved = true; }
    else if (keys.has("s") || keys.has("arrowdown")) { moveTank(player, DOWN); moved = true; }
    else if (keys.has("a") || keys.has("arrowleft")) { moveTank(player, LEFT); moved = true; }
    else if (keys.has("d") || keys.has("arrowright")) { moveTank(player, RIGHT); moved = true; }

    if (shooting) fire(player);
  }

  // ---------- 关卡推进 ----------
  function checkWave() {
    if (pendingEnemies <= 0 && enemies.length === 0) {
      level++;
      if (level > 99) level = 99;
      startLevel();
    }
  }

  function startLevel() {
    makeMap();
    player = makeTank(playerSpawn.x, playerSpawn.y, UP, "player");
    // 保留护盾/连射效果重置；生命继承
    player.shield = 60 * 3;
    enemies = [];
    bullets = [];
    powerups = [];
    pendingEnemies = 4 + level * 2;
    spawnCount = 0;
    spawnTimer = 30;
    baseAlive = true;
    addFloating(W / 2, H / 2 - 20, "第 " + level + " 关", "#e6edf3");
  }

  function spawnLoop() {
    if (pendingEnemies > 0 && enemies.length < 4 + Math.min(2, Math.floor(level / 3))) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        pendingEnemies--;
        spawnTimer = Math.max(40, 140 - level * 6);
      }
    }
  }

  // ---------- 流程控制 ----------
  function startGame() {
    score = 0; lives = 3; level = 1;
    particles = []; floatingTexts = [];
    startLevel();
    state = "play";
    updateHUD();
    ensureAudio();
  }

  function gameOver() {
    state = "gameover";
    updateHUD();
  }

  function playerDeath() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameOver();
      return;
    }
    // 重生
    const v = DIR_VEC[player.dir];
    player.x = playerSpawn.x; player.y = playerSpawn.y; player.dir = UP;
    player.hp = 1; player.shield = 60 * 3; player.cd = 0;
  }

  function togglePause() {
    if (state === "play") state = "pause";
    else if (state === "pause") state = "play";
  }

  function updateHUD() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("lives").textContent = lives;
    document.getElementById("enemies").textContent = pendingEnemies + enemies.length;
  }

  // ---------- 主循环 ----------
  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min(50, now - lastTime);
    lastTime = now;

    if (state === "play") {
      updatePlayer();
      updateEnemies();
      updateBullets();
      updatePowerups();
      spawnLoop();
      checkWave();

      // 玩家被摧毁
      if (player && player.hp <= 0) playerDeath();

      // 敌人子弹命中基地已由 updateBullets 处理
      if (shake > 0) shake--;
      updateHUD();
    }

    // 粒子持续动画
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      p.vx *= 0.96; p.vy *= 0.96;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 0.6; floatingTexts[i].life--;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }

    render();
    requestAnimationFrame(loop);
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 0.6, (Math.random() - 0.5) * shake * 0.6);
    }
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGrid();
    drawPowerups();
    if (player && player.hp > 0) drawTank(player);
    for (const e of enemies) if (e.hp > 0) drawTank(e);
    drawBullets();
    drawParticles();
    drawFloating();
    if (state === "start" || state === "gameover" || state === "pause") drawOverlay();
    ctx.restore();
  }

  function drawBackground() {
    ctx.fillStyle = "#02040a";
    ctx.fillRect(0, 0, W, H);
    // 细微网格
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += T) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += T) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function drawGrid() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (t === EMPTY) continue;
        const x = c * T, y = r * T;
        if (t === BRICK) drawBrick(x, y);
        else if (t === STEEL) drawSteel(x, y);
        else if (t === WATER) drawWater(x, y);
        else if (t === TREE) drawTree(x, y);
        else if (t === BASE) drawBase(x, y);
      }
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#8c3f2a";
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#b3593c";
    // 砖缝
    for (let row = 0; row < 2; row++) {
      const by = y + row * 20;
      ctx.fillRect(x, by, T, 2);
      for (let k = 0; k < 2; k++) {
        const bx = x + (k === 0 ? 12 : 0);
        ctx.fillRect(bx, by + 8, 16, 8);
        ctx.fillRect(bx + (k === 0 ? 24 : 12), by + 8, 16, 8);
      }
    }
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.strokeRect(x + 0.5, y + 0.5, T - 1, T - 1);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = "#5b6672";
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#8a99a8";
    ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
    ctx.fillStyle = "#aebdcc";
    ctx.fillRect(x + 8, y + 8, T - 16, T - 16);
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.strokeRect(x + 0.5, y + 0.5, T - 1, T - 1);
  }

  function drawWater(x, y) {
    ctx.fillStyle = "#123a5a";
    ctx.fillRect(x, y, T, T);
    ctx.strokeStyle = "#2f6ea8";
    ctx.lineWidth = 2;
    const t = (Date.now() / 300) % 20;
    for (let i = -1; i < 3; i++) {
      const yy = y + (i * 14 + t) % (T + 14) - 7;
      ctx.beginPath();
      ctx.moveTo(x + 4, yy);
      ctx.quadraticCurveTo(x + T / 2, yy - 4, x + T - 4, yy);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  }

  function drawTree(x, y) {
    ctx.fillStyle = "#14351d";
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#1f5c2e";
    for (let i = 0; i < 6; i++) {
      const px = x + 6 + (i % 3) * 10;
      const py = y + 6 + Math.floor(i / 3) * 14;
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBase(x, y) {
    // 旗杆
    ctx.fillStyle = "#e6edf3";
    ctx.fillRect(x + T / 2 - 2, y + 6, 4, T - 12);
    // 旗帜（被摧毁则灰色）
    ctx.fillStyle = baseAlive ? "#f85149" : "#6e7681";
    ctx.beginPath();
    ctx.moveTo(x + T / 2 + 2, y + 8);
    ctx.lineTo(x + T / 2 + 18, y + 13);
    ctx.lineTo(x + T / 2 + 2, y + 18);
    ctx.closePath();
    ctx.fill();
    // 底座
    ctx.fillStyle = "#8a99a8";
    ctx.fillRect(x + 8, y + T - 6, T - 16, 4);
  }

  function drawTank(t) {
    if (t.flash > 0 && Math.floor(t.flash / 2) % 2 === 0) return; // 闪烁
    ctx.save();
    ctx.translate(t.x + TANK / 2, t.y + TANK / 2);
    const rot = t.dir * (Math.PI / 2);
    ctx.rotate(rot);

    const isPlayer = t.kind === "player";
    const body = isPlayer ? "#2ea043" : "#da3633";
    const bodyDark = isPlayer ? "#1f6f34" : "#a12825";
    const track = isPlayer ? "#1b4332" : "#5c1a18";

    // 履带
    ctx.fillStyle = track;
    ctx.fillRect(-TANK / 2, -TANK / 2, 7, TANK);
    ctx.fillRect(TANK / 2 - 7, -TANK / 2, 7, TANK);
    // 履带纹理
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    for (let i = -TANK / 2 + 4; i < TANK / 2 - 2; i += 6) {
      ctx.fillRect(-TANK / 2 + 1, i, 5, 3);
      ctx.fillRect(TANK / 2 - 6, i, 5, 3);
    }
    // 车身
    ctx.fillStyle = body;
    ctx.fillRect(-TANK / 2 + 7, -TANK / 2 + 4, TANK - 14, TANK - 8);
    ctx.fillStyle = bodyDark;
    ctx.fillRect(-TANK / 2 + 7, TANK / 2 - 8, TANK - 14, 4);
    // 炮塔
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = isPlayer ? "#3fb950" : "#ff6b69";
    ctx.beginPath();
    ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = bodyDark;
    ctx.fillRect(-3, -TANK / 2 - 2, 6, 12);

    ctx.restore();

    // 护盾
    if (t.shield > 0) {
      ctx.strokeStyle = "rgba(88,166,255,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x + TANK / 2, t.y + TANK / 2, TANK / 2 + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.fillStyle = b.owner === "player" ? "#f0f6fc" : "#ffd166";
      ctx.shadowColor = b.owner === "player" ? "#58a6ff" : "#f85149";
      ctx.shadowBlur = 6;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.shadowBlur = 0;
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      const info = POWERUP_INFO[p.type];
      const blink = Math.floor(p.t / 8) % 2 === 0;
      if (p.t > 480 && blink) continue; // 快消失时闪烁
      ctx.fillStyle = "rgba(22,27,34,0.9)";
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = info.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
      ctx.fillStyle = info.color;
      ctx.font = "bold 18px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(info.icon, p.x + p.w / 2, p.y + p.h / 2 + 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30);
      ctx.fillStyle = p.color;
      if (p.ring) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (30 - p.life) * 1.2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawFloating() {
    ctx.font = "bold 14px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const f of floatingTexts) {
      ctx.globalAlpha = Math.min(1, f.life / 25);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawOverlay() {
    ctx.fillStyle = "rgba(2,4,10,0.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#e6edf3";
    ctx.font = "bold 40px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    if (state === "start") {
      ctx.fillText("钢铁前线", W / 2, H / 2 - 40);
      ctx.font = "18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#c9d1d9";
      ctx.fillText("守卫你的基地，击退敌军坦克！", W / 2, H / 2 + 6);
      ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#8b949e";
      ctx.fillText("WASD / 方向键移动 · 空格射击", W / 2, H / 2 + 40);
      ctx.fillStyle = "#3fb950";
      ctx.font = "bold 20px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      const blink = Math.floor(Date.now() / 500) % 2 === 0;
      if (blink) ctx.fillText("按 空格 / 回车 开始", W / 2, H / 2 + 90);
    } else if (state === "gameover") {
      ctx.fillStyle = "#f85149";
      ctx.fillText("游戏结束", W / 2, H / 2 - 40);
      ctx.font = "20px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#c9d1d9";
      ctx.fillText("最终得分：" + score, W / 2, H / 2 + 10);
      ctx.fillStyle = "#8b949e";
      ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      const blink = Math.floor(Date.now() / 500) % 2 === 0;
      if (blink) ctx.fillText("按 空格 / 回车 重新开始", W / 2, H / 2 + 60);
    } else if (state === "pause") {
      ctx.fillText("已暂停", W / 2, H / 2);
      ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = "#8b949e";
      ctx.fillText("按 P 继续", W / 2, H / 2 + 40);
    }
  }

  // ---------- 启动 ----------
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
